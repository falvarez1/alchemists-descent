      @font-face {
        font-family: 'Cormorant Garamond';

      }
      :root { --slate: #0b1417; --paper: #e6dfca; --brass: #d5b982; --brass-strong: #f2e3b6; }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: var(--slate); color: var(--paper); }
      body {
        display: flex; flex-direction: column; align-items: center; gap: 28px; padding: 40px 16px 48px;

        background: radial-gradient(ellipse 80% 60% at 50% 30%, #13242b, var(--slate) 70%);

      h1 { margin: 0; font-weight: 600; font-size: clamp(34px, 6vw, 64px); letter-spacing: 0.1em; color: var(--brass-strong); text-align: center; }
      h1 small { display: block; margin-top: 6px; font-size: 0.34em; letter-spacing: 0.34em; color: var(--brass); font-variant: small-caps; }
      video { width: min(100%, 1280px); aspect-ratio: 16 / 9; background: #000; border: 2px solid var(--brass); box-shadow: 0 30px 90px rgb(0 0 0 / 70%); }
      .play {
        display: inline-block; padding: 14px 30px; border: 2px solid var(--brass); color: var(--slate); background: var(--brass);
        font: 600 clamp(20px, 2.4vw, 26px)/1 'Cormorant Garamond', Georgia, serif; letter-spacing: 0.08em; text-decoration: none;
      }
      .play:hover, .play:focus-visible { background: var(--brass-strong); }
      p { margin: 0; font-size: clamp(17px, 1.8vw, 21px); opacity: 0.85; text-align: center; max-width: 760px; }
      footer { font-size: 15px; letter-spacing: 0.3em; font-variant: small-caps; color: var(--brass); opacity: 0.8; }
