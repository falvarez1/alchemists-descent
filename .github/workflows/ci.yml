name: CI

# The backstop, not the gate (docs/split/SPLIT-PLAN.md D15): every change is verified locally first (typecheck, lint,
# tests, build, the oracles and the gate probes). This workflow re-runs the FAST checks on every PR and push to main,
# in two parallel jobs: the static checks, and a browser smoke with one findability seed. The full suite (every seed,
# encounter lairs, all 15 gate probes) runs nightly in nightly.yml. The Pages deploy uses the same strict
# `npm run build` entry point.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit, strict)
        run: npm run typecheck

      - name: Builder boundary guard
        run: npm run verify:builder-boundaries

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Production build
        run: GH_PAGES=true npm run build

      - name: Builder bundle boundary
        run: npm run verify:builder-bundle

      - name: AssemblyScript WASM generation
        run: |
          npm run build:wasm
          git diff --exit-code -- src/world/virtual/wasm/roundCornersWasm.ts

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for browser probes
        run: npx playwright-core install --with-deps chromium

      - name: Runtime browser safety probes
        env:
          PLAYWRIGHT_BROWSER_CHANNEL: chromium
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 &
          DEV_PID=$!
          trap "kill $DEV_PID" EXIT
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5173/ >/dev/null
          npm run verify:runtime-ui -- http://127.0.0.1:5173/
          # The debug probe drives a live Weaver gait; on a GPU-less runner the sim
          # occasionally leaves it standing for the whole window. One retry.
          node scripts/verify-debug-tool.mjs http://127.0.0.1:5173/ || node scripts/verify-debug-tool.mjs http://127.0.0.1:5173/
          node scripts/verify-builder-expedition.mjs http://127.0.0.1:5173/
          # One seed, every floor: the smoke. Every seed and the encounter lairs run nightly.
          node scripts/verify-findability.mjs http://127.0.0.1:5173/ 1
          # Two browser contexts against this dev server: the /builder.html
          # editor route and the play route, syncing over the relay the dev
          # server mounts. The editor route once sat broken for weeks because
          # only unit tests ran here.
          npm run verify:authorlink -- http://127.0.0.1:5173/

      - name: Builder production lazy-load network probe
        env:
          PLAYWRIGHT_BROWSER_CHANNEL: chromium
        # The player build carries no Builder at all; this probe needs the
        # production AUTHORING build, whose Builder must stay lazy.
        run: |
          GH_PAGES=true npm run build:authoring
          npm run preview:dist -- --host 127.0.0.1 --port 4173 --base /alchemists-descent/ &
          PREVIEW_PID=$!
          trap "kill $PREVIEW_PID" EXIT
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4173/alchemists-descent/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/alchemists-descent/ >/dev/null
          npm run verify:builder-prod-network -- http://127.0.0.1:4173/alchemists-descent/
